<style>
#pdfBtn,[data-act="pdf"]{display:none!important}
/* Layout: sticky top bar with tabs, full-width work area; cases open in a right-hand drawer (full screen on phones). */
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface2:#F4F7F8; --line:#D4DBDF;
  --ink:#101C26; --muted:#58697A; --accent:#0A6B50; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8;
  --warn:#8A5A00; --warn-soft:#FBEFD2; --bad:#A3261F; --bad-soft:#FADDD9; --ok:#0A6B50;
  --bar:#FFFFFF; --shadow:0 8px 30px rgba(16,28,38,.18);
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#151F25; --surface2:#1B2830; --line:#273640;
  --ink:#E6EDF0; --muted:#94A5AF; --accent:#3FB58E; --accent-ink:#04140E; --accent-soft:#143A2E;
  --warn:#F0B84A; --warn-soft:#3A2D10; --bad:#F08A80; --bad-soft:#40201D; --ok:#3FB58E;
  --bar:#121B20; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151F25; --surface2:#1B2830; --line:#273640;
  --ink:#E6EDF0; --muted:#94A5AF; --accent:#3FB58E; --accent-ink:#04140E; --accent-soft:#143A2E;
  --warn:#F0B84A; --warn-soft:#3A2D10; --bad:#F08A80; --bad-soft:#40201D; --ok:#3FB58E;
  --bar:#121B20; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.top .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;max-width:none;margin:0 auto}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:block;transform:rotate(45deg)}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);background:var(--accent-soft);font-weight:600}
nav .badge{margin-left:6px;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.top .sp{flex:1}
.search{width:220px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:none;margin:0 auto;padding-block:18px 60px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:14px}
.pagehead h1{font-size:22px;letter-spacing:-.015em}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:17px;font-weight:500}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 252px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;min-height:160px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding:10px 12px 2px;display:flex;justify-content:space-between;gap:8px}
.col h3 span{color:var(--muted);font-family:var(--mono)}
.col .sum{padding:0 12px 8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.cards{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .nm{font-weight:600}
.card .ad{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px}
.card .go{align-self:flex-start;margin-top:2px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
fieldset.odfs{border-color:#0078d4;background:rgba(0,120,212,.07)}fieldset.odfs legend{color:#2f4a40}
fieldset.secfs{border-color:#00897b;background:rgba(0,137,123,.06)}fieldset.secfs legend{color:#2f4a40}
.sec2{border:1px solid #00897b;border-left-width:5px;border-radius:7px;padding:10px;margin-bottom:10px;background:rgba(0,137,123,.10)}
.sec2 .top2>span:first-child{color:#00897b;font-weight:700}
.sec2.sec2-collapsed .sgrid{display:none}
.sec2 .secsum{font-size:12px;margin:2px 0 8px}
.ev.sec{border-left:4px solid #00897b}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--ok);border-color:transparent}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* reminders */
.group{margin-bottom:22px}
.group h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.group h3.bad{color:var(--bad)}
.ev{display:grid;grid-template-columns:120px 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
.ev:hover{border-color:var(--accent)}
.ev .d{font-family:var(--mono);font-size:12px}
.ev .d small{display:block;color:var(--muted)}
.ev .who{font-size:12px;color:var(--muted)}
@media (max-width:560px){.ev{grid-template-columns:1fr}}

/* income tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px}
.tile span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* drawer */
#drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
#drawer .bk{position:absolute;inset:0;background:rgba(8,14,18,.5)}
.panel{position:relative;width:min(max(720px,46vw),1100px);height:100%;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px}
.dh h2{font-size:20px;letter-spacing:-.01em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px}
.strip div{display:flex;flex-direction:column}
.strip b{font-family:var(--mono);font-weight:500}
.strip span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.db{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:14px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:0;padding:12px 14px 14px;min-width:0}
legend{float:left;width:100%;box-sizing:border-box;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#2f4a40;padding:0 0 7px;margin:0 0 10px;font-weight:700;border-bottom:1px solid #d3ddd8}
legend+*{clear:both}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) legend,:root:not([data-theme="light"]) fieldset.secfs legend,:root:not([data-theme="light"]) fieldset.odfs legend{color:#a9cdbb}:root:not([data-theme="light"]) legend{border-bottom-color:#33403b}}
:root[data-theme="dark"] legend,:root[data-theme="dark"] fieldset.secfs legend,:root[data-theme="dark"] fieldset.odfs legend{color:#a9cdbb}:root[data-theme="dark"] legend{border-bottom-color:#33403b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:14px;width:100%;min-width:0}
.pl{display:flex;gap:12px;min-height:16px;font-size:12px}
.pl a{color:var(--accent);text-decoration:none;font-weight:600}
.pl a:hover{text-decoration:underline}
.secbtn{margin-left:6px;padding:1px 8px;font-size:11px}
fieldset.sec-hidden>.grid{display:none}
fieldset[data-col]{--sc:#8a8f94;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-color:color-mix(in srgb,var(--sc) 38%,var(--line))}
fieldset[data-col] legend{border-bottom-color:color-mix(in srgb,var(--sc) 38%,var(--line))}
fieldset[data-col="applicants"]{--sc:#a68a4b}
fieldset[data-col="notes"]{--sc:#c9971c}
fieldset[data-col="tasks"]{--sc:#4f9a3c}
fieldset[data-col="case"]{--sc:#7a5fc0}
fieldset[data-col="lender"]{--sc:#d0634f}
fieldset[data-col="protection"]{--sc:#c0507e}
fieldset.secfs[data-col]{--sc:#00897b}
fieldset.odfs[data-col]{--sc:#0078d4}
fieldset.col-closed>*:not(legend){display:none}
.dhb .btn{white-space:nowrap}
.secbtn[data-sectoggle],#ntHide,#prHide{display:none}
.cno{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;vertical-align:1px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--accent)}
.app{border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:10px;background:var(--surface2)}
.app .top2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;background:var(--bar);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 16px}
.task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.add input[type=text]{flex:1;min-width:160px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.tkedit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}.tkedit input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.tkedit input[type=text]{flex:1;min-width:160px}.add input[type=time],.tact input[type=time]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.tact input[type=time]{padding:3px 6px;font-size:12px}
.add input[type=date]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.note{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.tblwrap{overflow-x:auto;max-width:100%}
table.nt.xl td{padding:4px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:48px;outline:none;white-space:pre-wrap;vertical-align:top;font-size:13px;font-weight:400;text-align:left}
table.nt.xl td:focus{outline:2px solid var(--accent);outline-offset:-2px}
.tblbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.tblpend{margin:4px 0 8px}
table.nt{width:auto;min-width:0;border-collapse:collapse;font-size:13px;margin:2px 0}
table.nt th,table.nt td{padding:4px 9px;border:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg)}
table.nt th{font-weight:600;background:var(--surface2)}
.note small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:2px}
.np{--c:#0A6B50;padding:6px 9px;margin:4px 0;border-radius:5px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.np1{--c:#2A62A8}.np2{--c:#B07A00}.np3{--c:#9A2F7C}.np4{--c:#C0392B}.np5{--c:#5B47B8}
#tray{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:35;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
#tray .th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
#tray .th h2{font-size:20px}
#tray .tb{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.tadd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tadd input{padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;width:100%}
.tadd .wide2{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tgh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#2f4a40;margin:8px 0 6px}
.tgh.bad{color:#2f4a40}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tgh,:root:not([data-theme="light"]) .tgh.bad{color:#81c784}}
:root[data-theme="dark"] .tgh,:root[data-theme="dark"] .tgh.bad{color:#81c784}
.tt{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:6px}
.tt.bad{border-left-color:var(--bad)}.tt.warn{border-left-color:var(--warn)}
.tt.done .tx{text-decoration:line-through;color:var(--muted)}
.tt input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.tm{flex:1;min-width:0}.tx{overflow-wrap:anywhere}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.tact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tact input[type=date]{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px}
.tpage{max-width:1200px;margin-left:auto;margin-right:auto}
.nb{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.nbside{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:calc(100vh - 170px);overflow-y:auto}
.nbi{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-top:6px;cursor:pointer}
.nbi.on{border-color:var(--accent);background:var(--accent-soft)}
.nbi span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbmain{min-width:0}
.nbt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:17px;font-weight:600;margin-bottom:8px}
.bdc{border:1px solid var(--line);border-left:4px solid #d81b60;border-radius:8px;background:var(--surface);padding:10px 12px;margin-bottom:8px}
.bdc.sent{border-left-color:#2e7d32;opacity:.75}
.bdh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.bdc textarea{width:100%;margin-top:8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit;font-size:14px;line-height:1.45;resize:vertical}
.bdban{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid #d81b60;border-radius:8px;background:var(--surface);padding:8px 12px;margin:0 0 12px}
.bdok{color:#2e7d32;font-weight:600;font-size:12px;margin-left:8px}.bdchk{display:flex;align-items:center;gap:6px;padding:0 8px;font-size:14px}.bdchk input{width:18px;height:18px;accent-color:#2e7d32}
.bdwa{background:#1faa59;border-color:#1faa59;color:#fff}
.apwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:980px){.apwrap{grid-template-columns:1fr}}
.aphead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.aphead h2{margin:0 8px 0 0;font-size:18px}
.apgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.apdow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
.apcell{min-height:96px;text-align:left;vertical-align:top;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;font:inherit}
.apcell:hover{border-color:var(--accent)}

function latestNoteCell(c,key){var n=(c[key||'notes']||[]).slice().sort(function(a,b){return b.ts-a.ts})[0];if(!n)return '<span class="muted">—</span>';var t=String(n.text||'');if(!t&&n.table)t='[Table]';if(t.length>110)t=t.slice(0,110)+'…';return '<div class="muted" style="font-family:var(--mono);font-size:11px">'+stampOf(n.ts)+'</div>'+esc(t)}

function names(c){var a=(c.applicants||[]).map(function(x){return x.name}).filter(Boolean);return a.length?a.join(' & '):'Unnamed client'}
function ownReview(c){return c.reviewDate||(c.fixedUntil?addMonths(c.fixedUntil,-6):'')}
function secReview(x){return x.reviewDate||(x.fixedUntil?addMonths(x.fixedUntil,-6):'')}
function reviewItems(c){
  var secs=c.securities||[];
  if(secs.length){var out=[];secs.forEach(function(x){var d=secReview(x);if(d)out.push({date:d,addr:x.address||'Security address',lender:x.lender||'',fixedUntil:x.fixedUntil||'',sec:true})});return out}
  var d=ownReview(c);return d?[{date:d,addr:'',lender:'',fixedUntil:c.fixedUntil||'',sec:false}]:[];
}
function reviewOf(c){var r=reviewItems(c).map(function(x){return x.date}).sort();return r[0]||''}
function rateEndOf(c){var secs=c.securities||[];if(secs.length){var r=secs.map(function(x){return x.fixedUntil}).filter(Boolean).sort();return r[0]||''}return c.fixedUntil||''}
function firstName(c){var a=(c.applicants||[]).map(function(x){return (x.name||'').trim()}).filter(Boolean)[0]||'';return a.replace(/^(mr|mrs|miss|ms|dr)\.?\s+/i,'').toLowerCase()}
function cnum(c){var m=/(\d+)/.exec(c.clientNo||'');return m?+m[1]:1e9}
function odLink(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Open OneDrive folder</a>':''}
/* ---------- pasted tables: Excel colours kept, cells editable ---------- */
var ntTable=null,prTable=null,tblTimer=null;
function safeColor(v){v=String(v||'').trim();return /^#[0-9a-fA-F]{6}$/.test(v)?v:''}
function rgbHex(s){var m=/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s\/]+([\d.]+))?/.exec(s||'');if(!m)return '';if(m[4]!=null&&+m[4]===0)return '';return '#'+[m[1],m[2],m[3]].map(function(x){return ('0'+Math.min(255,+x).toString(16)).slice(-2)}).join('')}
function lum(h){return (0.299*parseInt(h.substr(1,2),16)+0.587*parseInt(h.substr(3,2),16)+0.114*parseInt(h.substr(5,2),16))/255}
function cellStyle(c){
  var s=[],bg=safeColor(c.bg),col=safeColor(c.c),bd=safeColor(c.bd);
  if(bg){s.push('background:'+bg);s.push('color:'+(col||'#101C26'))}else if(col&&lum(col)>0.25&&lum(col)<0.9){s.push('color:'+col)}
  if(c.b)s.push('font-weight:700');if(c.i)s.push('font-style:italic');

}

function tblInner(rows,edit){var w=0;rows.forEach(function(r){if(r.length>w)w=r.length});return rows.map(function(r){var h='';for(var i=0;i<w;i++)h+=cellHtml(r[i],edit);return '<tr>'+h+'</tr>'}).join('')}

}

function parseTable(html,cb){
  var doc=new DOMParser().parseFromString(html,'text/html'),tb=doc.querySelector('table');
  if(!tb){cb(null);return}
  doc.querySelectorAll('script,link,img,iframe,object,embed,meta,base,form,svg,video,audio').forEach(function(x){x.remove()});
  var styles='';doc.querySelectorAll('style').forEach(function(s){styles+=s.outerHTML});
  var fr=document.createElement('iframe'),done=false;
  fr.setAttribute('sandbox','allow-same-origin');
  fr.style.cssText='position:fixed;left:-9999px;top:0;width:1200px;height:800px;visibility:hidden;border:0';
  function finish(r){if(done)return;done=true;try{fr.remove()}catch(e){}cb(r)}
  fr.onload=function(){
    try{
      var d=fr.contentDocument,w=fr.contentWindow,rows=[],width=0,cells=0,cut=false;
      d.querySelectorAll('table tr').forEach(function(tr){
        if(rows.length>=200||cells>1500){cut=true;return}
        var r=[];
        Array.prototype.slice.call(tr.children).forEach(function(td){
          if(!/^t[dh]$/i.test(td.tagName)||r.length>=30)return;
          var cs=w.getComputedStyle(td),c={v:(td.textContent||'').replace(/\s+/g,' ').trim()};
          var bg=rgbHex(cs.backgroundColor);if(bg)c.bg=bg;
          var fc=rgbHex(cs.color);if(fc&&lum(fc)>0.12)c.c=fc;
          var fw=cs.fontWeight;if(fw==='bold'||+fw>=600)c.b=1;
          if(cs.fontStyle==='italic')c.i=1;
          if(cs.textAlign==='center'||cs.textAlign==='right')c.a=cs.textAlign;
          var bc='';['Top','Right','Bottom','Left'].forEach(function(sd){if(!bc&&cs['border'+sd+'Style']!=='none'&&parseFloat(cs['border'+sd+'Width'])>0)bc=rgbHex(cs['border'+sd+'Color'])||'#888888'});
          if(bc)c.bd=bc;
          r.push(c);cells++;
          var span=Math.min(+td.getAttribute('colspan')||1,10);
          for(var k=1;k<span&&r.length<30;k++){var e={v:''};if(c.bg)e.bg=c.bg;if(c.bd)e.bd=c.bd;r.push(e)}
        });
        if(r.length){rows.push(r);if(r.length>width)width=r.length}
      });
      rows.forEach(function(r){while(r.length<width)r.push({v:''})});

    }catch(e){finish(null)}
  };
  setTimeout(function(){finish(null)},4000);

  document.body.appendChild(fr);
}
function readRows(w){
  var ts=+w.getAttribute('data-ts'),list=w.getAttribute('data-list'),c=list==='nbtables'?notes.filter(function(x){return x.id===nbShown})[0]:currentCase();if(!c)return null;
  var arr=(list==='nbtables'?c.tables:c[list])||[],idx=-1;arr.forEach(function(n,i){if(n.ts===ts)idx=i});

  var w=0;rows.forEach(function(r){if(r.length>w)w=r.length});

function paras(t){
  var lines=String(t||'').replace(/\r\n?/g,'\n').split('\n'),out=[],tbl=[],k=0;

  return out.join('');
}
function nextTask(c){var d=(c.tasks||[]).filter(function(t){return !t.done&&t.due}).map(function(t){return t.due}).sort();return d[0]||''}

  return l.slice().sort(function(a,b){
    if(sortBy==='first'){var x=firstName(a),y=firstName(b);if(!x&&y)return 1;if(x&&!y)return -1;return x.localeCompare(y)||cnum(a)-cnum(b)}

function caseEvents(c){

  return over||e.filter(function(x){return diff(x.date)>=0})[0]||null;
}

function nbClean(html){
  var doc=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html'),out=document.createElement('div');

      if(n.nodeType!==1)return;

      if(/^(script|style|iframe|object|embed|svg|math|template|noscript|textarea|select|button|input|img|video|audio|link|meta)$/.test(tg))return;

      if(col)st.push('color:'+col);
      if(fam)st.push('font-family:'+fam);

    });
  }
  walk(doc.body,out,0);

}

/* ---------- add case from PDFs ---------- */
function pdfText(file){
  if(!window.pdfjsLib)return Promise.reject(new Error('The PDF reader did not load'));
  return file.arrayBuffer().then(function(buf){
    return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var out='',chain=Promise.resolve();
    for(var i=1;i<=pdf.numPages;i++)(function(n){
      chain=chain.then(function(){return pdf.getPage(n)}).then(function(pg){return pg.getTextContent()}).then(function(tc){
        var last=null,line='';
        tc.items.forEach(function(it){
          var y=it.transform[5];
          if(last!==null&&Math.abs(y-last)>2){out+=line+'\n';line=''}
          line+=it.str+' ';last=y;
        });
        out+=line+'\n';
      });
    })(i);
    return chain.then(function(){return out});
  });
}
var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function cleanDraft(r){
  var d={},numKeys=['purchasePrice','propertyValue','loanAmount','termYears','rate','followOnRate','monthlyPayment','dipAmount'];
  var strKeys=['propertyAddress','lender','lenderRef','product','erc','conveyancer','estateAgent'];
  var dateKeys=['fixedUntil','reviewDate','dipDate','dipExpiry','appDate','offerDate','offerExpiry','completionDate'];
  strKeys.forEach(function(k){if(typeof r[k]==='string'&&r[k].trim())d[k]=r[k].trim()});
  numKeys.forEach(function(k){var n=num(r[k]);if(n!=null)d[k]=n});
  dateKeys.forEach(function(k){if(typeof r[k]==='string'&&DATE_RE.test(r[k]))d[k]=r[k]});
  d.stage=stageIdx(r.stage)>-1?r.stage:'enquiry';
  d.type=TYPES.indexOf(r.type)>-1?r.type:'Purchase';
  d.repayment=['repayment','interest-only','part-and-part'].indexOf(r.repayment)>-1?r.repayment:'repayment';
  d.applicants=(Array.isArray(r.applicants)?r.applicants:[]).slice(0,4).map(function(a){
    var o={};['name','address','phone','email'].forEach(function(k){if(a&&typeof a[k]==='string')o[k]=a[k].trim()});
    if(a&&typeof a.dob==='string'&&DATE_RE.test(a.dob))o.dob=a.dob;return o;
  }).filter(function(a){return a.name});
  if(!d.applicants.length)d.applicants=[{}];
  return d;
}
function importPdfs(files){
  if(!db){toast('Saving is not available in this view');return}
  toast('Reading '+files.length+' PDF'+(files.length>1?'s':'')+'…',true);
  var texts=[];
  files.reduce(function(chain,f){
    return chain.then(function(){return pdfText(f)}).then(function(t){
      if(t.replace(/\s/g,'').length<80)throw new Error(f.name+' has no readable text. Scanned PDFs are not supported.');
      texts.push('=== FILE: '+f.name+' ===\n'+t);
    });
  },Promise.resolve()).then(function(){
    return claude.use('sample');
  }).then(function(sample){
    if(!sample)throw new Error('Reading documents with Claude is not available in this view');
    toast('Extracting case details…',true);
    var prompt='You extract mortgage case data for a UK mortgage adviser from lender documents (decision in principle, mortgage offer, illustration, or similar). Several files may belong to one case.\n\n'+
    'Return ONLY a JSON object with these keys. Use null for anything the documents do not state. Never guess or invent values.\n'+
    '- applicants: array of {name, address, dob, phone, email}. Name as written in the document, including title. dob as YYYY-MM-DD.\n'+
    '- stage: one of enquiry, factfind, dip, application, offer, completed. A decision in principle only = "dip". A mortgage offer letter = "offer".\n'+
    '- type: one of Purchase, First-time buyer, Remortgage, Product transfer, Further advance, Buy to let, Other.\n'+
    '- propertyAddress (security address, single line), purchasePrice, propertyValue (lender valuation), loanAmount, termYears, repayment ("repayment", "interest-only" or "part-and-part").\n'+
    '- lender, lenderRef (roll number or application reference), product (product code or name), rate (initial rate, percent as a number), fixedUntil (YYYY-MM-DD, end of initial rate period), followOnRate (rate after the initial period, percent), monthlyPayment (regular monthly payment during the initial period, not a one-off first payment), erc (early repayment charge summary as short text).\n'+
    '- dipDate, dipExpiry, dipAmount (maximum amount in a DIP), appDate, offerDate, offerExpiry, completionDate. Dates as YYYY-MM-DD. Use the letter date as dipDate or offerDate for the matching document.\n'+
    '- conveyancer (name and address if given), estateAgent.\n'+
    '- summary: one or two sentences noting anything an adviser should watch, such as term warnings, valuation basis or conditions.\n'+
    'All money values are plain numbers in pounds with no symbols.\n\nDOCUMENTS:\n'+texts.join('\n\n').slice(0,90000);
    return sample.json(prompt,{modelTier:'default'});
  }).then(function(r){
    if(!r||typeof r!=='object')throw new Error('Could not read the case details');
    var d=cleanDraft(r);
    var note='Created from PDF: '+files.map(function(f){return f.name}).join(', ')+'.'+(typeof r.summary==='string'&&r.summary?' '+r.summary:'');
    d.notes=[{ts:Date.now(),text:note}];
    $('#toast').hidden=true;
    openDrawer(null,d);
  }).catch(function(e){
    toast((e&&e.message)||'Could not read the PDFs',false);
  });
}

/* ---------- auto save (every 5 seconds) ---------- */
var lastAuto=null,newBase=null,lastND='',lastPD='';
function draftSave(){
  var a=$('#ntText'),b=$('#prText'),o={};
  if(a&&a.value!==lastND){lastND=a.value;ntDraft=a.value;o.noteDraft=a.value}
  if(b&&b.value!==lastPD){lastPD=b.value;prDraft=b.value;o.protDraft=b.value}
  if(Object.keys(o).length)patch(openId,o).then(function(){var m=$('#autoMsg');if(m)m.textContent='Auto-saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
}
var creatingNew=false;
function autoSave(){
  if(!openId&&col&&!creatingNew){
    var dn=$('#drawer');
    if(dn&&!dn.hidden&&$('#caseForm')){
      var nd=collectForm();
      if(nd.applicants.length&&JSON.stringify(nd)!==newBase){
        creatingNew=true;
        if(!nd.clientNo)nd.clientNo=nextClientNo();
        var nref=col.doc();nd.createdAt=Date.now();nd.updatedAt=nd.createdAt;nd.tasks=[];nd.notes=pendingNotes;
        write(nref.id,function(){return nref.set(nd)}).then(function(){
          creatingNew=false;
          if(!openId&&dn&&!dn.hidden&&$('#caseForm')){openId=nref.id;var cf=$('#f-clientNo');if(cf&&!cf.value)cf.value=nd.clientNo;lastAuto=JSON.stringify(collectForm());var m=$('#autoMsg');if(m)m.textContent='Auto-saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
        },function(){creatingNew=false});
      }
    }
    return;
  }
  if(!openId||!col||lastAuto===null)return;
  var dr=$('#drawer');if(!dr||dr.hidden||!$('#caseForm'))return;
  draftSave();
  var data=collectForm();
  if(!data.applicants.length)return;
  var key=JSON.stringify(data);
  if(key===lastAuto)return;
  lastAuto=key;
  patch(openId,data).then(function(){var m=$('#autoMsg');if(m)m.textContent='Auto-saved '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
}
setInterval(autoSave,5000);

document.addEventListener('drop',function(e){var t=e.target;if(t&&t.closest&&t.closest('#nbBody')){e.preventDefault();var tx=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||'';if(tx)document.execCommand('insertText',false,tx)}},true);
document.addEventListener('paste',function(e){
  var t=e.target;
  if(t&&t.closest&&t.closest('table.nt.xl')){e.preventDefault();var tx=(e.clipboardData&&e.clipboardData.getData('text/plain')||'').replace(/\s+/g,' ');document.execCommand('insertText',false,tx);return}
  if(t&&t.closest&&t.closest('#nbBody')){
    var h2=e.clipboardData&&e.clipboardData.getData('text/html');
    var pl2=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
    e.preventDefault();
    if(!h2||!/<table/i.test(h2)){document.execCommand('insertText',false,pl2);return}
    parseTable(h2,function(tb){
      if(!tb){document.execCommand('insertText',false,pl2);return}
      var nn2=notes.filter(function(x){return x.id===nbShown})[0];if(!nn2)return;
      nbSetTables((nn2.tables||[]).concat([{ts:Date.now(),table:{rows:tb.rows}}]));
      toast(tb.cut?'Table added. Only the first 200 rows and 30 columns were kept':'Table added to this note');
    });
    return;
  }
  if(!t||(t.id!=='ntText'&&t.id!=='prText'))return;
  var html=e.clipboardData&&e.clipboardData.getData('text/html');
  if(!html||!/<table/i.test(html))return;
  var plain=e.clipboardData.getData('text/plain'),s0=t.selectionStart,s1=t.selectionEnd,k=t.id==='ntText'?'nt':'pr';
  e.preventDefault();
  parseTable(html,function(tb){
    if(!tb){t.setRangeText(plain,s0,s1,'end');return}
    if(k==='nt')ntTable=tb;else prTable=tb;
    showPend(k);if(tb.cut)toast('That table is large. Only the first 200 rows and 30 columns were kept');
  });
},true);

document.addEventListener('keydown',function(e){
  var td=e.target&&e.target.closest&&e.target.closest('table.nt.xl td');
  if(!td||e.key!=='Enter')return;
  e.preventDefault();
  var tr=td.parentNode,nx=tr.nextElementSibling;
  if(nx){var cell=nx.children[Array.prototype.indexOf.call(tr.children,td)];if(cell)cell.focus()}
});
